[project]
name = "trace-backend"
version = "0.1.0"
description = "Trace modular-monolith foundation"
requires-python = ">=3.13,<3.14"
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "sqlalchemy>=2.0.36,<2.1",
  "alembic>=1.14,<2",
  "uvicorn>=0.34,<1",
  "httpx2>=2,<3",
  "anyio>=4.15,<5",
  "pyjwt[crypto]>=2.15.1,<3",
]

[dependency-groups]
dev = [
  "pytest>=8.3,<10", "pytest-cov>=6,<8",
  "pytest-socket>=0.7,<1", "ruff>=0.9,<1", "mypy>=1.14,<2",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--allow-hosts=127.0.0.1,::1 --allow-unix-socket --cov=app --cov-report=term-missing --cov-fail-under=85"

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]
files = ["app", "alembic", "scripts"]

[tool.coverage.run]
branch = true

[tool.coverage.report]
exclude_also = ["if TYPE_CHECKING:", "^\\s*\\.\\.\\.$"]
